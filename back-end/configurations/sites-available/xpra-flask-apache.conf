# Load SSL module properly
LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
LoadModule socache_shmcb_module /usr/lib/apache2/modules/mod_socache_shmcb.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module /usr/lib/apache2/modules/mod_proxy_wstunnel.so

# HTTP configuration - Redirect to HTTPS
<VirtualHost *:80>
    ServerName bda.as.kent.edu
    ServerAdmin webmaster@localhost
    
    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
    
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/flask.log combined
</VirtualHost>

# HTTPS configuration
<VirtualHost *:443>
    ServerName bda.as.kent.edu
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/site/bda.as.kent.edu.crt
    SSLCertificateKeyFile /etc/ssl/certs/site/bda.as.kent.edu.key
    
    SSLProxyEngine On
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off

    # Your existing configuration for XPRA, Flask, etc.
    <Location "/xpra/">
        ProxyPass http://ray-container:10000/
        ProxyPassReverse http://ray-container:10000/
    </Location>
    
    # WebSocket proxying for Xpra
    <Location "/xpra/ws">
        ProxyPass ws://ray-container:10000/ws
        ProxyPassReverse ws://ray-container:10000/ws
    </Location>

    # LoadModule proxy_wstunnel_module /usr/lib/apache2/modules/mod_proxy_wstunnel.so

    # <Location "/xpra/ws">
    #     SSLProxyEngine On
    #     ProxyPass ws://ray-container:10000/ws
    #     ProxyPassReverse ws://ray-container:10000/ws
    # </Location>
    
    # Flask application configuration
    WSGIDaemonProcess flaskapp python-home="/opt/conda/envs/pyimagej"
    WSGIScriptAlias / /var/www/html/flask/app.wsgi
    <Directory /var/www/html/flask>
        WSGIProcessGroup flaskapp
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>
    
    # Static files
    Alias /static /var/www/html/flask/static
    <Directory /var/www/html/flask/static/>
        Require all granted
    </Directory>
    
    RewriteEngine on
    RewriteCond %{HTTP_HOST} ^bda\.as\.kent\.edu$
    
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/flask.log combined
</VirtualHost>