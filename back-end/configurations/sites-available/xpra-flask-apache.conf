# Load SSL modules
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

# HTTP configuration - Redirect to HTTPS
<VirtualHost *:80>
    ServerName bda.as.kent.edu
    ServerAdmin webmaster@localhost
    
    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
    
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/flask.log combined
</VirtualHost>

# HTTPS configuration
<VirtualHost *:443>
    ServerName bda.as.kent.edu
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/site/bda.as.kent.edu.crt
    SSLCertificateKeyFile /etc/ssl/certs/site/bda.as.kent.edu.key
    
    # Optional SSL settings for security
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder on
    SSLCompression off
    
    # WebSocket and HTTP proxy for XPRA
    <Location "/xpra/">
        ProxyPass wss://ray-container:10000/
        ProxyPassReverse wss://ray-container:10000/
        ProxyPass https://ray-container:10000/
        ProxyPassReverse https://ray-container:10000/
    </Location>
    
    # Flask application configuration
    WSGIDaemonProcess flaskapp python-home="/opt/conda/envs/pyimagej"
    WSGIScriptAlias / /var/www/html/flask/app.wsgi
    <Directory /var/www/html/flask>
        WSGIProcessGroup flaskapp
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>
    
    # Static files
    Alias /static /var/www/html/flask/static
    <Directory /var/www/html/flask/static/>
        Require all granted
    </Directory>
    
    # Add security headers
    Header always set Strict-Transport-Security "max-age=63072000; includeSubdomains"
    
    RewriteEngine on
    RewriteCond %{HTTP_HOST} ^bda\.as\.kent\.edu$
    
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/flask.log combined
</VirtualHost>